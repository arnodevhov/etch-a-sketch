<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="style.css" />
    <title>Etch a Sketch</title>
  </head>
  <body>
    <div class="app">
      <div class="header">
        <h1 class="main-title">Etch-a-Sketch</h1>
      </div>
      <div class="main">
        <div class="board-settings">
          <button class="btn" id="set-board-size">Board size</button>
          <button class="btn" id="random-color">Random color</button>
          <button class="btn" id="darken-effect">Darken effect</button>
          <input type="color" id="set-color" />
        </div>
        <div class="board"></div>
      </div>
    </div>
    <script src="script.js" defer></script>
  </body>
</html>
